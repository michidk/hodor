<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  {% if not disable_default_css %}<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0f0f0f;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 20px;
      font-size: 1.5rem;
      font-weight: 700;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: #d4d4d4;
    }
    .password-field {
      position: relative;
      margin-bottom: 16px;
    }
    #password {
      width: 100%;
      padding: 12px 52px 12px 14px;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      background: #111111;
      color: #f5f5f5;
      font: inherit;
    }
    button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      background: #ffffff;
      color: #000000;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .password-toggle {
      position: absolute;
      right: 4px;
      top: 4px;
      bottom: 4px;
      width: auto;
      padding: 0 12px;
      border: 0;
      background: transparent;
      color: #d4d4d4;
    }
    .password-toggle svg {
      display: block;
    }
    .error {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(248, 113, 113, 0.25);
      background: rgba(127, 29, 29, 0.35);
      color: #f87171;
      animation: error-shake 300ms ease-in-out;
    }
    @keyframes error-shake {
      0%, 100% { transform: translateX(0); }
      25%, 75% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .error { animation: none; }
    }
  </style>{% endif %}
  {% if custom_css %}<style>{{ custom_css | safe }}</style>{% endif %}
</head>
<body>
  <main class="card">
    <h1>{{ title }}</h1>
    <form method="post" action="/_gate/login">
      <input type="hidden" name="redirect" value="/">
      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" name="password" type="password" autocomplete="current-password" autofocus required{% if show_error %} aria-invalid="true" aria-describedby="password-error"{% endif %}>
        <button class="password-toggle" type="button" aria-controls="password" aria-label="Show password" hidden>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="3"/>
            <path class="eye-slash" d="m3 3 18 18" visibility="hidden"/>
          </svg>
        </button>
      </div>
      <button type="submit">Continue</button>
    </form>
    {% if show_error %}<div id="password-error" class="error" role="alert">Wrong password.</div>{% endif %}
  </main>
  <script>
    const password = document.getElementById('password');
    const toggle = document.querySelector('.password-toggle');
    toggle.hidden = false;
    toggle.addEventListener('click', () => {
      const visible = password.type === 'password';
      password.type = visible ? 'text' : 'password';
      toggle.querySelector('.eye-slash').setAttribute('visibility', visible ? 'visible' : 'hidden');
      toggle.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
    });
    const redirect = document.querySelector('input[name="redirect"]');
    if (redirect) {
      redirect.value = `${window.location.pathname}${window.location.search}${window.location.hash}` || '/';
    }
  </script>
</body>
</html>
