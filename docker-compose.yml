services:
  gate:
    build: .
    ports:
      - "8080:8080"
    environment:
      PASSWORD: "${PASSWORD:?set PASSWORD to a unique login password}"
      UPSTREAM: "http://app:80"
    depends_on:
      - app

  app:
    image: traefik/whoami@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
